<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Pulse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050510;
      color: #e0e0e8;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated background grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: -2;
      animation: gridShift 20s linear infinite;
    }

    @keyframes gridShift {
      0% { background-position: 0 0; }
      100% { background-position: 60px 60px; }
    }

    /* Soft glow blobs */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255, 0, 229, 0.08) 0%, transparent 40%);
      z-index: -1;
      animation: pulse 8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 100px 24px 60px;
      position: relative;
      z-index: 1;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
    }

    .logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      background: linear-gradient(135deg, #001a2e, #1a0033);
      box-shadow:
        0 0 40px rgba(0, 212, 255, 0.4),
        0 0 80px rgba(255, 0, 229, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      background-clip: padding-box;
      animation: logoFloat 6s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .logo span {
      background: linear-gradient(90deg, #00d4ff, #ff00e5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.6));
    }

    h1 {
      font-size: 3rem;
      text-align: center;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #00d4ff, #a855f7, #ff00e5);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 6s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    .tagline {
      text-align: center;
      color: #8888a0;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
      margin-bottom: 60px;
    }

    h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: #00d4ff;
      margin: 48px 0 20px;
      font-weight: 600;
    }

    p, li {
      color: #b0b0c0;
      line-height: 1.7;
      font-size: 1rem;
    }

    a {
      color: #00d4ff;
      text-decoration: none;
      transition: color 0.2s, text-shadow 0.2s;
    }

    a:hover {
      color: #ff00e5;
      text-shadow: 0 0 12px rgba(255, 0, 229, 0.6);
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 12px;
      background: linear-gradient(90deg, rgba(0, 212, 255, 0.1), rgba(255, 0, 229, 0.1));
      border: 1px solid rgba(0, 212, 255, 0.3);
      color: #ffffff;
      font-weight: 600;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .cta:hover {
      border-color: rgba(255, 0, 229, 0.6);
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
      transform: translateY(-2px);
      text-shadow: none;
    }

    .links {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .footer {
      margin-top: 80px;
      padding-top: 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: #505060;
      font-size: 0.85rem;
      text-align: center;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <div class="logo"><span>BP</span></div>
    </div>

    <h1>Black Pulse</h1>
    <p class="tagline">A free and open-source music player for Android.</p>

    <h2>Download</h2>
    <p>
      <a class="cta" href="https://github.com/callix-tamilvanan/blackpulse/releases/latest">
        Get the latest release →
      </a>
    </p>

    <h2>About</h2>
    <p>
      Black Pulse is a fork of <a href="https://github.com/MetrolistGroup/Metrolist">Metrolist</a>,
      which is built on <a href="https://github.com/z-huang/InnerTune">InnerTune</a>.
      It is licensed under GPL v3.0.
    </p>

    <h2>Connect</h2>
    <div class="links">
      <a href="https://github.com/callix-tamilvanan">GitHub</a>
      <a href="https://www.instagram.com/callixtamilvanan/">Instagram</a>
      <a href="https://buymeacoffee.com/callix_tamilvanan">Buy Me a Coffee</a>
    </div>

    <div class="footer">
      Made by Callix Tamilvanan
    </div>
  </div>
</body>
</html>
