<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Pulse</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0f;
      color: #e0e0e8;
      max-width: 700px;
      margin: 80px auto;
      padding: 0 24px;
      line-height: 1.6;
    }
    h1 {
      font-size: 2.5rem;
      background: linear-gradient(90deg, #00d4ff, #ff00e5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .tagline {
      color: #9090a0;
      margin-bottom: 2rem;
    }
    a {
      color: #00d4ff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .footer {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid #202030;
      color: #606070;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>Black Pulse</h1>
  <p class="tagline">A free and open-source music player for Android.</p>

  <h2>Download</h2>
  <p><a href="https://github.com/callix-tamilvanan/BlackPulse/releases">Get the latest release on GitHub →</a></p>

  <h2>About</h2>
  <p>Black Pulse is a fork of <a href="https://github.com/MetrolistGroup/Metrolist">Metrolist</a>, which is built on <a href="https://github.com/z-huang/InnerTune">InnerTune</a>. It is licensed under GPL v3.0.</p>

  <div class="footer">
    <p>Made by Callix Tamilvanan · <a href="https://github.com/callix-tamilvanan">GitHub</a></p>
  </div>
</body>
</html>
